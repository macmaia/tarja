# .github/workflows/release-tarja-presidio.yml
# [RELEASE-BR] EN: publishes the tarja-presidio plugin to PyPI when a tag like tarja-presidio-v0.1.0 is pushed.
# [RELEASE-BR] PT: publica o plugin tarja-presidio no PyPI qdo sobe uma tag tipo tarja-presidio-v0.1.0.
#
# EN: the tag prefix matters. release.yml listens on "v*", which does NOT match "tarja-presidio-v*", so the two
#     workflows never fire on the same tag. Keep it that way: an unprefixed tag would publish the wrong package.
# PT: o prefixo da tag importa. O release.yml escuta "v*", q NAO casa c/ "tarja-presidio-v*", entao os 2 nunca
#     disparam na mesma tag. Mantenha assim: tag sem prefixo publicaria o pacote errado.
#
# EN: one-off setup (manual): PyPI > Publishing > Add a new pending publisher, with
#     project tarja-presidio, owner macmaia, repo tarja, workflow release-tarja-presidio.yml, environment pypi
# PT: setup 1x (manual): PyPI > Publishing > Add a new pending publisher, c/ os campos acima

name: release-tarja-presidio

on:
  push:
    tags: ["tarja-presidio-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # [RELEASE-PERM] EN: job-level permissions REPLACE the workflow-level block, so contents: read has to
      #   be restated here or checkout breaks. actions: read is what lets gh read another workflow's runs.
      #   PT: permissao de job SUBSTITUI a do workflow, entao o contents: read tem q ser repetido aqui,
      #   senao o checkout quebra. O actions: read e o q deixa o gh ler run de outro workflow.
      actions: read
    steps:
      # [RELEASE-AUDIT-GATE] EN: refuse to publish while the latest audit run on main is not a success.
      #   v0.8.0 went to PyPI while the audit job had been red for five days and nobody looked, and the
      #   pypi environment had no protection rules, so there was no gate of any kind. A tag push does NOT
      #   fire audit (its push trigger is branches: [main]), so this reads main's latest run and prints the
      #   commit that run covered, because the paths filter means that commit can be older than this tag.
      #   status is checked separately from conclusion: a run still in progress has an empty conclusion, and
      #   without that check the gate would block a release for the wrong reason and not say so.
      #   First step and before checkout on purpose: a blocked release then costs no clone, which keeps the
      #   traffic numbers usable as an adoption signal (see the header of audit.yml).
      #   PT: recusa publicar enquanto o ultimo run do audit na main nao for success. A v0.8.0 subiu p/ o
      #   PyPI c/ o audit vermelho havia cinco dias e sem nenhuma regra no environment pypi. Tag nao dispara
      #   o audit, entao le o ultimo run da main e imprime qual commit aquele run cobriu, pq o filtro de
      #   paths permite que esse commit seja mais antigo que esta tag. O status e conferido separado da
      #   conclusion, pq run em andamento tem conclusion vazia. Primeiro passo e antes do checkout de
      #   proposito: release bloqueado assim nao custa clone.
      - name: audit gate / portao do audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r ID STATUS CONCL SHA <<<"$(gh run list -R ${{ github.repository }} \
            --workflow=audit.yml --branch main --limit 1 \
            --json databaseId,status,conclusion,headSha \
            --jq '.[0] | "\(.databaseId) \(.status) \(.conclusion) \(.headSha)"')"
          echo "audit run=$ID status=$STATUS conclusion=$CONCL commit=$SHA"
          echo "this tag  = ${{ github.sha }}"
          test -n "$ID"
          test "$STATUS" = "completed"
          test "$CONCL" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # EN: the plugin needs tarja itself, installed from this same checkout / PT: o plugin precisa do tarja daqui
      # [RELEASE-BR-DEV] EN: ".[dev]" matters: the root pytest config sets --cov, so --no-cov below only
      #   exists when pytest-cov is installed, and it lives in the ROOT dev extra, not the plugin's.
      #   PT: o ".[dev]" importa: a config de pytest da raiz usa --cov, entao o --no-cov abaixo so existe
      #   c/ pytest-cov instalado, q esta no extra dev da RAIZ e nao no do plugin.
      - run: pip install -e ".[dev]" -e "packages/tarja-presidio[dev]" build
      - run: pytest packages/tarja-presidio/tests -p no:cacheprovider --no-cov
        env:
          TARJA_REQUIRE_PRESIDIO: "1"
      # EN: tag tarja-presidio-v0.1.0 must match __version__ 0.1.0 / PT: a tag tem q bater c/ o __version__
      - name: check version / confere versao
        run: |
          PKG=$(python -c "import tarja_presidio; print(tarja_presidio.__version__)")
          TAG=${GITHUB_REF_NAME#tarja-presidio-v}
          echo "package=$PKG tag=$TAG"
          test "$PKG" = "$TAG"
      - run: python -m build packages/tarja-presidio --outdir dist/
      # [RELEASE-SBOM] EN: the plugin DOES have a runtime chain (tarja plus presidio-analyzer plus whatever
      #   Presidio pulls), so unlike the core this SBOM is long, and a long one is the correct result. No size
      #   assertion here for that reason: the core asserts <= 2 because the core ships alone.
      #   Installed WITH its dependencies, into a throwaway venv, so the file describes what a user receives
      #   and not what this job happens to have installed. See [RELEASE-SBOM-ENV] in release.yml.
      #   PT: o plugin TEM cadeia de execucao, entao aqui o SBOM e longo e isso e o certo. Sem asserção de
      #   tamanho, de proposito. Instalado COM as dependencias num venv descartavel.
      - run: pip install cyclonedx-bom
      - name: sbom of the published wheel / sbom da roda publicada
        run: |
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/python -m pip install --quiet --upgrade pip
          /tmp/sbomenv/bin/python -m pip install --quiet dist/*.whl
          cyclonedx-py environment /tmp/sbomenv/bin/python --output-format JSON > sbom.cdx.json
          python -c "import json;c=json.load(open('sbom.cdx.json')).get('components',[]);print(len(c),'componentes')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-tarja-presidio
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/tarja-presidio/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-tarja-presidio
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          # [RELEASE-BR-DUP] EN: a duplicated tag push fires this twice and the second upload hits "file already
          #   exists", which is not a failure worth a red X. skip-existing keeps a genuine error red.
          #   PT: tag disparada 2x faz o 2o upload bater em "file already exists", q nao e falha de verdade.
          skip-existing: true
