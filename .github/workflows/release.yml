# .github/workflows/release.yml
# [RELEASE] EN: publish to PyPI when a tag like v0.1.0 is pushed (E1.6). Uses PyPI Trusted Publishing, no token stored.
# [RELEASE] PT: publica no PyPI qdo sobe uma tag tipo v0.1.0 (E1.6). Usa Trusted Publishing do PyPI, sem token guardado.
#
# EN: one-off setup, done manually once: register this workflow as a trusted publisher on PyPI
#     (project "tarja", owner macmaia, repo tarja, workflow release.yml, environment pypi)
# PT: setup 1x, feito a mao uma vez: cadastrar este workflow como trusted publisher no PyPI
#     (projeto "tarja", owner macmaia, repo tarja, workflow release.yml, environment pypi)
#
# EN: to release: bump __version__ in src/tarja/__init__.py, commit, then: git tag v0.1.0 && git push origin v0.1.0
# PT: p/ lancar: sobe o __version__ em src/tarja/__init__.py, commit, dps: git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # [RELEASE-BUILD] EN: tests again, checks tag == package version, builds sdist + wheel
  # [RELEASE-BUILD] PT: roda os testes de novo, confere tag == versao do pacote, gera sdist + wheel
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # [RELEASE-PERM] EN: job-level permissions REPLACE the workflow-level block, so contents: read has to
      #   be restated here or checkout breaks. actions: read is what lets gh read another workflow's runs.
      #   PT: permissao de job SUBSTITUI a do workflow, entao o contents: read tem q ser repetido aqui,
      #   senao o checkout quebra. O actions: read e o q deixa o gh ler run de outro workflow.
      actions: read
    steps:
      # [RELEASE-AUDIT-GATE] EN: refuse to publish while the latest audit run on main is not a success.
      #   v0.8.0 went to PyPI while the audit job had been red for five days and nobody looked, and the
      #   pypi environment had no protection rules, so there was no gate of any kind. A tag push does NOT
      #   fire audit (its push trigger is branches: [main]), so this reads main's latest run and prints the
      #   commit that run covered, because the paths filter means that commit can be older than this tag.
      #   status is checked separately from conclusion: a run still in progress has an empty conclusion, and
      #   without that check the gate would block a release for the wrong reason and not say so.
      #   First step and before checkout on purpose: a blocked release then costs no clone, which keeps the
      #   traffic numbers usable as an adoption signal (see the header of audit.yml).
      #   PT: recusa publicar enquanto o ultimo run do audit na main nao for success. A v0.8.0 subiu p/ o
      #   PyPI c/ o audit vermelho havia cinco dias e sem nenhuma regra no environment pypi. Tag nao dispara
      #   o audit, entao le o ultimo run da main e imprime qual commit aquele run cobriu, pq o filtro de
      #   paths permite que esse commit seja mais antigo que esta tag. O status e conferido separado da
      #   conclusion, pq run em andamento tem conclusion vazia. Primeiro passo e antes do checkout de
      #   proposito: release bloqueado assim nao custa clone.
      - name: audit gate / portao do audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r ID STATUS CONCL SHA <<<"$(gh run list -R ${{ github.repository }} \
            --workflow=audit.yml --branch main --limit 1 \
            --json databaseId,status,conclusion,headSha \
            --jq '.[0] | "\(.databaseId) \(.status) \(.conclusion) \(.headSha)"')"
          echo "audit run=$ID status=$STATUS conclusion=$CONCL commit=$SHA"
          echo "this tag  = ${{ github.sha }}"
          test -n "$ID"
          test "$STATUS" = "completed"
          test "$CONCL" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: pytest
      # EN: tag v0.1.0 must match __version__ 0.1.0, otherwise fail
      # PT: tag v0.1.0 tem q bater c/ __version__ 0.1.0, senao falha
      - name: check version / confere versao
        run: |
          PKG=$(python -c "import tarja; print(tarja.__version__)")
          TAG=${GITHUB_REF_NAME#v}
          echo "package=$PKG tag=$TAG"
          test "$PKG" = "$TAG"
      - run: python -m build
      # [RELEASE-SBOM] EN: a bill of materials for the RELEASED WHEEL, in CycloneDX. The core has no runtime
      #   dependency, so this file is short, and that is the point: a vendor review asks for an SBOM and the
      #   honest answer here is a very small one. Uploaded as its own artifact rather than into dist/,
      #   because anything in dist/ goes to PyPI.
      #   PT: lista de materiais da RODA PUBLICADA, em CycloneDX. O nucleo nao tem dependencia de execucao,
      #   entao o arquivo e curto, e e justamente esse o argumento.
      #
      # [RELEASE-SBOM-ENV] EN: it has to be a throwaway venv, not this job's environment. `cyclonedx-py
      #   environment` describes whatever python it is pointed at, and the runner's python by then holds
      #   build, cyclonedx-bom and their trees. Pointed at the CI python it produced a 51-component SBOM
      #   listing pytest, ruff, mypy, hypothesis, lxml and coverage, none of which a user installs, published
      #   under a comment claiming the file was nearly empty. Install the built wheel with --no-deps into an
      #   empty venv and describe THAT.
      #   PT: tem de ser um venv descartavel, nao o ambiente deste job. Apontado p/ o python do CI, o comando
      #   descrevia pytest, ruff, mypy e companhia, 51 componentes, sob um comentario dizendo que o arquivo
      #   era quase vazio.
      - run: pip install cyclonedx-bom
      - name: sbom of the published wheel / sbom da roda publicada
        run: |
          python -m venv --without-pip /tmp/sbomenv
          pip install --python /tmp/sbomenv/bin/python --no-deps dist/*.whl
          cyclonedx-py environment /tmp/sbomenv/bin/python --output-format JSON > sbom.cdx.json
      # [RELEASE-SBOM-ASSERT] EN: the guard that would have caught the 51 components. The core ships itself
      #   and nothing else, so anything above 2 means the SBOM is describing the wrong environment again.
      #   PT: a guarda q teria pegado os 51 componentes.
      - name: sbom is not inflated / sbom nao esta inflado
        run: |
          python - <<'PYSBOM'
          import json
          components = json.load(open("sbom.cdx.json")).get("components", [])
          names = sorted(c.get("name", "?") for c in components)
          print(len(components), "component(s):", names)
          assert len(components) <= 2, f"SBOM describes {len(components)} components, see [RELEASE-SBOM-ENV]"
          PYSBOM
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  # [RELEASE-PUBLISH] EN: uploads to PyPI via OIDC (id-token), protected by the "pypi" environment
  # [RELEASE-PUBLISH] PT: sobe p/ o PyPI via OIDC (id-token), protegido pelo environment "pypi"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/tarja/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
