# pyproject.toml
# EN: build (hatch), tests (pytest), lint (ruff) config
# PT: config de build (hatch), testes (pytest), lint (ruff)

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tarja"
dynamic = ["version"]
description = "Detects, validates and masks Brazilian personal identifiers in free text, using Portuguese context and check digits. CPF, CNPJ (incl. alphanumeric), CNS, CNJ case numbers and 13 more. / Detecta, valida e mascara identificadores pessoais brasileiros em texto livre, c/ contexto em portugues e digito verificador."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Maria Alice Maia", email = "tarja@micah6ai.com" }]  # https://github.com/macmaia
keywords = ["pii", "lgpd", "gdpr", "brazil", "cpf", "cnpj", "anonymisation", "presidio", "dlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Text Processing",
]
# EN: core has zero dependencies, on purpose / PT: core sem dependencia, de proposito
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "jsonschema>=4.20", "pyyaml>=6", "ruff>=0.6", "mypy>=1.11"]
# EN: optional, only to run the benchmark against other systems / PT: opcional, so p/ rodar o benchmark em outros sistemas
bench = ["presidio-analyzer>=2.2", "azure-ai-textanalytics>=5.3", "google-cloud-dlp>=3.18", "spacy>=3.7", "anthropic>=0.40", "openai>=1.50"]

# EN: "tarja" command after pip install / PT: comando "tarja" dps do pip install
[project.scripts]
tarja = "tarja.cli:main"

[project.urls]
Source = "https://github.com/macmaia/tarja"
Issues = "https://github.com/macmaia/tarja/issues"

[tool.hatch.version]
path = "src/tarja/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tarja"]

# [HATCH-DEV] editable installs (pip install -e .) also put the repo root on sys.path, so bench/ and tools/
#   import without the pytest pythonpath shortcut. The published wheel still ships src/tarja only.
[tool.hatch.build]
dev-mode-dirs = ["src", "."]

[tool.pytest.ini_options]
# EN: minimum 90% coverage (same bar as Presidio) / PT: cobertura min. 90% (mesma regua do Presidio)
testpaths = ["tests"]
# EN: repo root on the path so tests can import bench/ / PT: raiz no path p/ os testes importarem o bench/
pythonpath = ["."]
addopts = "--cov=tarja --cov-report=term-missing --cov-fail-under=90"

[tool.mypy]
# [MYPY] public package only, stdlib types, no third-party stubs needed
files = ["src/tarja"]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.ruff]
# EN: contrib/presidio-pr follows Presidio's own style, packages have their own tests
# PT: contrib/presidio-pr segue o estilo do Presidio
extend-exclude = ["contrib/presidio-pr"]
# EN: pre-commit passes file names directly, force-exclude makes it respect the list above
# PT: o pre-commit passa os arquivos direto, force-exclude faz ele respeitar a lista acima
force-exclude = true
# EN: 125 because comments are bilingual / PT: 125 pq os comentarios sao bilingues
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "N", "SIM"]
