# spec/entities/br_titulo_eleitor.yaml
# [SPEC-TITULO] EN: Titulo de eleitor spec. Follows spec/schema.json
# [SPEC-TITULO] PT: spec de Titulo de eleitor. Segue spec/schema.json

id: BR_TITULO_ELEITOR
name: "Titulo de eleitor"
description: "Brazilian voter ID (\"titulo de eleitor\"). 12 digits: 8 sequence, 2 state code, 2 mod-11 check digits."
description_pt: "Titulo de eleitor. 12 digitos: 8 sequencial, 2 codigo da UF, 2 DVs mod 11."
country_code: br
tier: N1
status: experimental  # EN: until the official TSE check-digit doc is attached / PT: ate anexar o doc oficial do TSE
since: "0.3"
lgpd:
  category: pessoal

# EN: candidate regexes / PT: regex de candidatos
patterns:
  - name: titulo_spaced  # 0043 5687 0906 / 004356870906
    regex: '\b\d{4}\s?\d{4}\s?\d{4}\b'
    score: 0.3

validator:
  function: tarja.validators.titulo.is_valid
  algorithm: "state/UF 01..28, DV1 = sum(seq*(2..9)) % 11, DV2 = (uf*7,8 + DV1*9) % 11, 10 -> 0, SP/MG 0 -> 1"

# EN: nearby words (Portuguese on purpose) / PT: palavras de contexto (em PT de proposito)
context:
  words: ["titulo de eleitor", "titulo eleitoral", "inscricao eleitoral", "eleitor"]
  window: 60
  required: false

score:
  valid_with_context: 0.95
  valid_without_context: 0.8
  invalid_dv: null

sources:
  - title: "TSE, Resolucao 21.538/2003"
    url: https://www.tse.jus.br/legislacao/compilada/res/2003/resolucao-no-21-538-de-14-de-outubro-de-2003
    accessed: "2026-09-19"

# EN: generated test examples / PT: exemplos gerados p/ teste
examples:
  valid: ["102345670183", "1023 4567 0388", "100000010116"]
  invalid: ["102345670184", "102345672999", "10234567018"]
