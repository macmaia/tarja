# spec/entities/br_titulo_eleitor.yaml
# [SPEC-TITULO] EN: Titulo de eleitor spec. Follows spec/schema.json
# [SPEC-TITULO] PT: spec de Titulo de eleitor. Segue spec/schema.json

id: BR_TITULO_ELEITOR
name: "Titulo de eleitor"
description: "Brazilian voter ID (\"titulo de eleitor\"). 12 digits: 8 sequence, 2 state code, 2 mod-11 check digits."
description_pt: "Titulo de eleitor. 12 digitos: 8 sequencial, 2 codigo da UF, 2 DVs mod 11."
country_code: br
tier: N1
status: beta  # EN: TSE Res. 23.659/2021 art. 36 confirms layout + mod 11; weights and SP/MG rule not in the text / PT: Res. TSE 23.659/2021 art. 36 confirma layout + mod 11; pesos e regra SP/MG nao estao no texto
since: "0.3"
lgpd:
  category: pessoal

# EN: candidate regexes / PT: regex de candidatos
patterns:
  - name: titulo_spaced  # 0043 5687 0906 / 004356870906
    regex: '\b\d{4}\s?\d{4}\s?\d{4}\b'
    score: 0.3

validator:
  function: tarja.validators.titulo.is_valid
  algorithm: "state/UF 01..28, DV1 = sum(seq*(2..9)) % 11, DV2 = (uf*7,8 + DV1*9) % 11, 10 -> 0, SP/MG 0 -> 1"

# EN: nearby words (Portuguese on purpose) / PT: palavras de contexto (em PT de proposito)
context:
  # EN: "inscricao" bare and the feminine "eleitora" come from real nomination dossiers measured on
  #   22/09/2026: the certificates write "Inscricao: NNNN NNNN NNNN" and "Eleitora: NAME", and neither
  #   matched. Without them a real number scored 0.8, the same as a run of years in a table.
  # PT: "inscricao" solto e o feminino "eleitora" vieram de dossies reais medidos em 22/09/2026.
  words: ["titulo de eleitor", "titulo eleitoral", "inscricao eleitoral", "inscricao", "eleitor",
          "eleitora", "zona eleitoral", "justica eleitoral"]
  window: 60
  required: false

score:
  valid_with_context: 0.95
  valid_without_context: 0.8
  invalid_dv: null

sources:
  - title: "TSE, Resolucao 23.659/2021, art. 36 (estrutura da inscricao, DV modulo 11)"
    url: https://www.tse.jus.br/legislacao/compilada/res/2021/resolucao-no-23-659-de-26-de-outubro-de-2021
    accessed: "2026-09-19"
  - title: "Wikipedia, Titulo de eleitor (regra do DV e excecao SP/MG, nao oficial)"
    url: https://pt.wikipedia.org/wiki/T%C3%ADtulo_de_eleitor
    accessed: "2026-09-19"
  - title: "TSE, Resolucao 21.538/2003"
    url: https://www.tse.jus.br/legislacao/compilada/res/2003/resolucao-no-21-538-de-14-de-outubro-de-2003
    accessed: "2026-09-19"

# EN: generated test examples / PT: exemplos gerados p/ teste
examples:
  valid: ["102345670183", "1023 4567 0388", "100000010116"]
  invalid: ["102345670184", "102345672999", "10234567018"]
