# packages/tarja-presidio/pyproject.toml
# EN: Presidio plugin for tarja: registers every tarja entity as a Presidio PatternRecognizer (E3.1)
# PT: plugin do Presidio p/ o tarja: registra toda entidade do tarja como PatternRecognizer do Presidio (E3.1)

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tarja-presidio"
dynamic = ["version"]
description = "Brazilian identifiers for Microsoft/Data Privacy Stack Presidio, powered by tarja. / Identificadores brasileiros p/ o Presidio, via tarja."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Maria Alice Maia", email = "tarja@micah6ai.com" }]  # https://github.com/macmaia
keywords = ["presidio", "pii", "lgpd", "brazil", "cpf", "cnpj"]
# EN: tarja does the validation, Presidio does the orchestration / PT: tarja valida, Presidio orquestra
# [PKG-DEPS] tarja>=0.7 is a floor, not decoration: the plugin reads tarja.entities.EntitySpec and the
#   key generation marker landed in 0.7. Without the floor an older tarja installs and the plugin
#   breaks at import, silently, on somebody else's machine.
dependencies = ["tarja>=0.7", "presidio-analyzer>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Source = "https://github.com/macmaia/tarja"

[tool.hatch.version]
path = "src/tarja_presidio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tarja_presidio"]
