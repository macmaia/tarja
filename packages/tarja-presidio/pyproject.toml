# packages/tarja-presidio/pyproject.toml
# EN: Presidio plugin for tarja: registers every tarja entity as a Presidio PatternRecognizer (E3.1)
# PT: plugin do Presidio p/ o tarja: registra toda entidade do tarja como PatternRecognizer do Presidio (E3.1)

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tarja-presidio"
dynamic = ["version"]
description = "Brazilian identifiers for Microsoft/Data Privacy Stack Presidio, powered by tarja. / Identificadores brasileiros p/ o Presidio, via tarja."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Maria Alice Maia", email = "tarja@micah6ai.com" }]  # https://github.com/macmaia
keywords = ["presidio", "pii", "pii-detection", "dlp", "anonymisation", "redaction", "lgpd", "brazil", "portuguese", "cpf", "cnpj"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
# EN: tarja does the validation, Presidio does the orchestration / PT: tarja valida, Presidio orquestra
# [PKG-DEPS] the floor is not decoration: the plugin reads tarja.entities.EntitySpec, and 0.9.0 closed five
#   fail-open defects plus removed strategy="hash". Raised to >=0.9 on 30/09/2026 so an older tarja cannot
#   install underneath the plugin and reintroduce a defect the plugin's own tests do not cover.
#   PT: o piso subiu p/ >=0.9 pq a 0.9.0 fechou cinco defeitos de falha-aberta.
dependencies = ["tarja>=0.9", "presidio-analyzer>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

# [PKG-PYTEST] EN: this section exists so pytest stops walking up to the repo root and inheriting its
#   addopts, which are "--cov=tarja --cov-fail-under=90". Measuring tarja's coverage from the plugin's
#   21 tests reports 46% and fails, which says nothing about the plugin and hides its real result.
#   PT: esta secao existe p/ o pytest parar de subir ate a raiz e herdar o addopts de cobertura do tarja.
#   Medir a cobertura do tarja com os 21 testes do plugin da 46% e reprova, o q nao diz nada sobre o plugin.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Homepage = "https://macmaia.github.io/tarja/"
Source = "https://github.com/macmaia/tarja"
Issues = "https://github.com/macmaia/tarja/issues"
Changelog = "https://github.com/macmaia/tarja/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/tarja_presidio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tarja_presidio"]
